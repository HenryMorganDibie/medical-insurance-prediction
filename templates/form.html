<!DOCTYPE html>
<html>
<head>
    <title>Medical Insurance Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to right, #83a4d4, #b6fbff); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px 40px; border-radius: 15px; box-shadow: 0px 10px 25px rgba(0,0,0,0.2); max-width: 400px; width: 100%; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input[type="number"], select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        input[type="submit"] { background-color: #4CAF50; color: white; padding: 10px; margin-top: 20px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Medical Insurance Charge Prediction</h2>
        <form method="POST" action="/predict_form">
            <label>Age:</label><input type="number" name="age" required>
            <label>BMI:</label><input type="number" step="0.1" name="bmi" required>
            <label>Children:</label><input type="number" name="children" required>
            <label>Sex:</label>
            <select name="sex"><option value="male">Male</option><option value="female">Female</option></select>
            <label>Smoker:</label>
            <select name="smoker"><option value="yes">Yes</option><option value="no">No</option></select>
            <label>Region:</label>
            <select name="region">
                <option value="northwest">Northwest</option>
                <option value="southeast">Southeast</option>
                <option value="southwest">Southwest</option>
            </select>
            <input type="submit" value="Predict">
        </form>
    </div>
</body>
</html>
