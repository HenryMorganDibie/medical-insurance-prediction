<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(to right, #83a4d4, #b6fbff); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px 40px; border-radius: 15px; box-shadow: 0px 10px 25px rgba(0,0,0,0.2); max-width: 500px; width: 100%; text-align: center; }
        .result { font-size: 20px; font-weight: bold; margin-top: 20px; color: #333; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px; }
        a:hover { background-color: #45a049; }
        canvas { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Predicted Insurance Charge</h2>
        <div class="result">${{ prediction | round(2) }}</div>
        <canvas id="chargeChart" width="400" height="200"></canvas>
        <a href="/">Predict Again</a>
    </div>
    <script>
        const ctx = document.getElementById('chargeChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Your Prediction', 'Dataset Average', 'Smoker Avg', 'Non-Smoker Avg'],
                datasets: [{
                    label: 'Charges ($)',
                    data: [
                        {{ prediction | round(2) }},
                        {{ average_charge | round(2) }},
                        {{ smoker_avg | round(2) }},
                        {{ nonsmoker_avg | round(2) }}
                    ],
                    backgroundColor: ['#4CAF50', '#2196F3', '#FF5722', '#FFC107']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Insurance Charge Comparison' }
                },
                scales: { y: { beginAtZero: true } }
            }
        });
    </script>
</body>
</html>
